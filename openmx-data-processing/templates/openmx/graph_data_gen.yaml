# HamGNN >= 2.3.0: the upstream generator always writes <graph_data_save_path>/graph_data.npz.
# Reading npz / lmdb / auto is still supported by the training-side dataset_params.data_format.
nao_max: __NAO_MAX__  # valid values: 14, 19, 26
graph_data_save_path: "__GRAPH_DATA_SAVE_DIR__"
read_openmx_path: "__READ_OPENMX_PATH__"  # read_openmx executable, or its parent directory
max_SCF_skip: 200
scfout_paths: "__SCFOUT_GLOB__"
dat_file_name: "__SYSTEM_NAME__.dat"
std_file_name: "__SYSTEM_NAME__.std"
scfout_file_name: "__SCFOUT_FILE_NAME__"
soc_switch: __SOC_SWITCH__
